<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Rice Cup Converter 2.0</title>
<style>
  :root {
    --bg: #f4f5fb; --card: #ffffff; --text: #1f2333; --muted: #6b7186;
    --accent: #4f46e5; --accent-soft: #eef0ff; --border: #e3e5f0;
    --ok: #16a34a; --warn: #d97706; --shadow: 0 6px 18px rgba(31,35,51,.08);
  }
  @media (prefers-color-scheme: dark) {
    :root {
      --bg: #14151d; --card: #1e2029; --text: #eceef6; --muted: #9aa0b4;
      --accent: #818cf8; --accent-soft: #2a2c44; --border: #32354a;
      --ok: #4ade80; --warn: #fbbf24; --shadow: 0 6px 18px rgba(0,0,0,.4);
    }
  }
  * { box-sizing: border-box; }
  body {
    margin: 0; min-height: 100vh; padding: 1.25rem;
    font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, "Helvetica Neue", Arial, sans-serif;
    background: var(--bg); color: var(--text);
  }
  .appbar { max-width: 460px; margin: 0 auto .9rem; display: flex; align-items: center; gap: .6rem; font-size: .85rem; }
  .appbar a { color: var(--muted); text-decoration: none; }
  .appbar a:hover { color: var(--accent); }
  .vtag { margin-left: auto; font-weight: 700; color: var(--accent); background: var(--accent-soft); border-radius: 999px; padding: .2rem .6rem; font-size: .72rem; }
  main { max-width: 460px; margin: 0 auto; display: grid; gap: 1rem; }
  .card { background: var(--card); border: 1px solid var(--border); border-radius: 14px; padding: 1.25rem; box-shadow: var(--shadow); }
  h1 { margin: 0 0 .25rem; font-size: 1.45rem; letter-spacing: -.02em; }
  .lead { margin: 0 0 1rem; color: var(--muted); font-size: .9rem; }
  label { display: block; font-size: .85rem; font-weight: 600; margin-bottom: .35rem; }
  .stepper { display: flex; gap: .5rem; }
  .stepper button {
    flex: 0 0 46px; font-size: 1.3rem; font-weight: 700; border: 1px solid var(--border);
    background: var(--bg); color: var(--text); border-radius: 10px; cursor: pointer;
  }
  .stepper button:hover { border-color: var(--accent); color: var(--accent); }
  input[type=number] {
    width: 100%; font: inherit; font-size: 1.15rem; padding: .65rem .8rem; text-align: center;
    color: var(--text); background: var(--bg); border: 1px solid var(--border); border-radius: 10px; outline: none;
  }
  input[type=number]:focus { border-color: var(--accent); }
  .result { margin-top: 1.1rem; background: var(--accent-soft); border-radius: 12px; padding: 1rem; text-align: center; }
  .result .num { font-size: 2.2rem; font-weight: 800; color: var(--accent); line-height: 1.1; }
  .result .lbl { color: var(--muted); font-size: .82rem; }
  .total { margin-top: .6rem; text-align: center; color: var(--muted); font-size: .85rem; }
  details summary { cursor: pointer; font-weight: 600; font-size: .95rem; }
  .settings-body { margin-top: 1rem; display: grid; gap: .9rem; }
  .presets { display: flex; flex-wrap: wrap; gap: .5rem; }
  .presets button {
    font: inherit; font-size: .8rem; padding: .35rem .7rem; border-radius: 999px; cursor: pointer;
    border: 1px solid var(--border); background: var(--bg); color: var(--text);
  }
  .presets button.active, .presets button:hover { border-color: var(--accent); color: var(--accent); background: var(--accent-soft); }
  .msg { font-size: .82rem; min-height: 1.1em; margin: .3rem 0 0; }
  .msg.ok { color: var(--ok); }
  .msg.err { color: var(--warn); }
</style>
</head>
<body>
<nav class="appbar">
  <a href="index.html">&larr; Dimis Webtools</a>
  <span class="vtag">2.0</span>
  <a href="rcc-index.html" onclick="localStorage.setItem('dwt-version','1')">Switch to 1.0</a>
</nav>
<main>
  <section class="card">
    <h1>Rice Cup Converter</h1>
    <p class="lead">Enter the rice amount – the water you need updates instantly.</p>

    <label for="riceInput">Cups of rice</label>
    <div class="stepper">
      <button type="button" id="minusBtn" aria-label="Decrease by half a cup">&minus;</button>
      <input type="number" id="riceInput" inputmode="decimal" min="0" step="0.5" placeholder="e.g. 2">
      <button type="button" id="plusBtn" aria-label="Increase by half a cup">+</button>
    </div>

    <div class="result">
      <div class="num" id="result">0.00</div>
      <div class="lbl">cups of water &middot; ratio 1 : <span id="ratioLabel">1.2</span></div>
    </div>
    <div class="total" id="total"></div>
  </section>

  <section class="card">
    <details>
      <summary>Settings &ndash; water ratio</summary>
      <div class="settings-body">
        <div>
          <label>Presets</label>
          <div class="presets" id="presets">
            <button type="button" data-r="1">Sushi rice 1 : 1</button>
            <button type="button" data-r="1.2">White rice 1 : 1.2</button>
            <button type="button" data-r="1.5">Basmati 1 : 1.5</button>
            <button type="button" data-r="2">Brown rice 1 : 2</button>
          </div>
        </div>
        <div>
          <label for="ratioInput">Custom ratio (cups of water per cup of rice)</label>
          <input type="number" id="ratioInput" inputmode="decimal" min="0.1" step="0.1">
          <p class="msg" id="ratioMsg"></p>
        </div>
      </div>
    </details>
  </section>
</main>
<script>
"use strict";
// Same key as version 1.0, so the saved ratio carries over between versions.
const LS_KEY = "waterToRiceRatio";

const riceInput = document.getElementById("riceInput");
const ratioInput = document.getElementById("ratioInput");
const resultEl = document.getElementById("result");
const totalEl = document.getElementById("total");
const ratioLabel = document.getElementById("ratioLabel");
const ratioMsg = document.getElementById("ratioMsg");
const presetsEl = document.getElementById("presets");

let ratio = parseFloat(localStorage.getItem(LS_KEY));
if (isNaN(ratio) || ratio <= 0) ratio = 1.2;
ratioInput.value = ratio;

function highlightPreset() {
  presetsEl.querySelectorAll("button").forEach(b =>
    b.classList.toggle("active", parseFloat(b.dataset.r) === ratio));
}

function update() {
  ratioLabel.textContent = ratio;
  const rice = parseFloat(riceInput.value);
  if (!isNaN(rice) && rice >= 0) {
    const water = rice * ratio;
    resultEl.textContent = water.toFixed(2);
    totalEl.textContent = rice > 0 ? `Total in the pot: ${(rice + water).toFixed(2)} cups` : "";
  } else {
    resultEl.textContent = "0.00";
    totalEl.textContent = "";
  }
  highlightPreset();
}

function setRatio(newRatio, showMsg) {
  ratio = newRatio;
  localStorage.setItem(LS_KEY, String(ratio));
  ratioInput.value = ratio;
  if (showMsg) {
    ratioMsg.textContent = "Ratio saved.";
    ratioMsg.className = "msg ok";
    clearTimeout(setRatio._t);
    setRatio._t = setTimeout(() => { ratioMsg.textContent = ""; }, 2000);
  }
  update();
}

riceInput.addEventListener("input", update);

ratioInput.addEventListener("input", () => {
  const r = parseFloat(ratioInput.value);
  if (!isNaN(r) && r > 0) {
    setRatio(r, true);
  } else if (ratioInput.value.trim() !== "") {
    ratioMsg.textContent = "Please enter a positive number.";
    ratioMsg.className = "msg err";
  }
});

presetsEl.addEventListener("click", e => {
  const btn = e.target.closest("button[data-r]");
  if (btn) setRatio(parseFloat(btn.dataset.r), true);
});

function step(delta) {
  const cur = parseFloat(riceInput.value) || 0;
  riceInput.value = Math.max(0, Math.round((cur + delta) * 2) / 2);
  update();
}
document.getElementById("plusBtn").addEventListener("click", () => step(0.5));
document.getElementById("minusBtn").addEventListener("click", () => step(-0.5));

update();
</script>
</body>
</html>
