name: CodeQL

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  schedule:
    # Weekly, so newly added CodeQL queries get a chance to run against
    # unchanged code.
    - cron: '41 5 * * 1'

permissions:
  contents: read

jobs:
  analyse:
    name: Analyse TypeScript
    runs-on: ubuntu-latest
    permissions:
      security-events: write
      actions: read
      contents: read

    steps:
      - uses: actions/checkout@v7

      - uses: github/codeql-action/init@v3
        with:
          languages: javascript-typescript
          # The extended suite includes the query packs for DOM injection sinks
          # and prototype pollution, which is precisely what this codebase's
          # storage and DOM layers are built to avoid.
          queries: security-extended

      - uses: github/codeql-action/analyze@v3
        with:
          category: '/language:javascript-typescript'
