name: Deploy to GitHub Pages

on:
  push:
    branches: [main]
  # Allows a redeploy from the Actions tab without an empty commit.
  workflow_dispatch:

# Least privilege: read the repo, write only a Pages deployment, and prove the
# artifact's provenance with an OIDC token.
permissions:
  contents: read
  pages: write
  id-token: write

# One deployment at a time, and never cancel one midway — a half-applied deploy
# would leave the site serving a mix of two builds.
concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build:
    name: Build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-node@v7
        with:
          node-version-file: .nvmrc
          cache: npm

      - run: npm ci

      # The same command CI runs and the same one a contributor runs locally.
      # This used to inline its own copy of the steps and had fallen behind —
      # still running the unit tests without the coverage thresholds — so the
      # path that publishes the site was the one gate nobody was actually
      # watching. There is one definition now, in package.json.
      - name: Verify
        run: npm run verify

      - name: Install Playwright browsers
        run: npm run e2e:install:all

      # The end-to-end suite gates the deploy, not just CI. It is the only thing
      # that covers `src/sw.ts` at all: a service worker is excluded from unit
      # coverage because jsdom has no ServiceWorkerGlobalScope, Cache API or
      # fetch interception, so Playwright cutting the network for real is the
      # only test of it that means anything. Publishing a broken one without
      # running that would be publishing the most persistent artifact on the
      # site — it outlives the tab — with nothing checking it.
      #
      # `e2e:all` rather than `e2e`: the local default is two projects, because
      # sixteen minutes on every change is not worth it for a site this size.
      # The gate that publishes still runs all four.
      - name: End-to-end tests
        run: npm run e2e:all

      - name: Upload the Playwright report on failure
        if: failure()
        uses: actions/upload-artifact@v7
        with:
          name: playwright-report-deploy
          path: playwright-report
          retention-days: 7

      - name: Build
        # `BASE_PATH` has to match where Pages serves the site from. For a project
        # site that is /<repo>/; set it to / if a custom domain is configured.
        env:
          BASE_PATH: /${{ github.event.repository.name }}/
        run: npm run build

      # `enablement: true` switches the repository's Pages source to "GitHub
      # Actions" on the first run, using the `pages: write` permission granted
      # above. Without it the deploy step fails while the repository is still set
      # to "Deploy from a branch", and the source has to be changed by hand in
      # Settings → Pages. Harmless once already set.
      - uses: actions/configure-pages@v5
        with:
          enablement: true

      - uses: actions/upload-pages-artifact@v3
        with:
          path: dist

  deploy:
    name: Deploy
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    outputs:
      page_url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v5

  # Everything above this point tests the site as built. This tests the site as
  # *served*, which is the one thing a local run can never do.
  #
  # The failure it exists for: a service worker answered with a non-JavaScript
  # `Content-Type` is rejected by the browser outright, and offline support
  # silently never turns on. Nothing in the build or the end-to-end suite can see
  # that, because it is a property of the host rather than the artifact. This used
  # to be a manual "open DevTools and look" step written down in the handoff; a
  # check nobody is reminded to run is not a check.
  verify-deployment:
    name: Verify the deployed worker
    needs: deploy
    runs-on: ubuntu-latest
    steps:
      - name: The served worker must be JavaScript, and have its manifest filled in
        env:
          PAGE_URL: ${{ needs.deploy.outputs.page_url }}
        run: |
          set -euo pipefail
          base="${PAGE_URL%/}/"
          echo "Checking $base"

          # Pages can take a few seconds to answer with the new deployment.
          worker=""
          for attempt in 1 2 3 4 5; do
            if worker=$(curl -fsS --max-time 30 "${base}sw.js"); then break; fi
            echo "sw.js not ready yet (attempt $attempt); retrying in 10s"
            sleep 10
          done
          if [ -z "$worker" ]; then
            echo "::error::${base}sw.js could not be fetched after five attempts."
            exit 1
          fi

          type=$(curl -fsSI --max-time 30 "${base}sw.js" \
            | tr -d '\r' \
            | awk -F': ' 'tolower($1) == "content-type" { print tolower($2) }')
          echo "sw.js Content-Type: ${type:-<none>}"
          case "$type" in
            *javascript*) ;;
            *)
              echo "::error::sw.js is served as '${type:-<none>}'. A service worker must be"
              echo "::error::served as JavaScript or the browser refuses to register it."
              exit 1
              ;;
          esac

          # The precache list is pasted in after Rollup hashes the filenames. An
          # unreplaced placeholder ships a worker that caches nothing and says
          # nothing about it.
          if printf '%s' "$worker" | grep -q '__PRECACHE_MANIFEST__\|__CACHE_VERSION__'; then
            echo "::error::sw.js still contains build placeholders."
            exit 1
          fi
          if ! printf '%s' "$worker" | grep -q 'dwt-'; then
            echo "::error::sw.js carries no cache name, so its manifest was not injected."
            exit 1
          fi

          # And the site it caches is actually being served.
          curl -fsS --max-time 30 -o /dev/null "$base"

          echo "The deployed worker is served as JavaScript with its manifest in place."
