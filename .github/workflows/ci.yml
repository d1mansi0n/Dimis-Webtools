name: CI

on:
  push:
    branches: [main]
  pull_request:
  # Weekly, so a newly published advisory against a dependency is noticed even
  # when nobody has touched the repository.
  schedule:
    - cron: '17 5 * * 1'

# Cancel a superseded run rather than paying for both.
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  verify:
    name: Format, lint, typecheck, unit tests, build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-node@v7
        with:
          node-version-file: .nvmrc
          cache: npm

      # `npm ci` installs exactly what the lockfile pins and fails if
      # package.json and the lockfile disagree.
      - run: npm ci

      # One command rather than a step per gate, so there is exactly one
      # definition of what "verified" means and it is the one a contributor runs
      # locally. Listing the steps here reads better in the Actions UI, and that
      # is precisely how this drifted: the deploy workflow kept its own copy and
      # was still running the tests without coverage thresholds long after
      # `verify` had gained them.
      - name: Verify
        run: npm run verify

      - name: Upload the built site
        uses: actions/upload-artifact@v7
        with:
          name: dist
          path: dist
          retention-days: 7

  audit:
    name: Dependency audit
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version-file: .nvmrc
          cache: npm
      - run: npm ci

      # The site ships zero runtime dependencies, so this is the audit that
      # speaks to what users actually receive. It must stay clean.
      - name: Audit production dependencies
        run: npm audit --omit=dev --audit-level=low

      # Build-time tooling is reported but does not fail the build: an advisory
      # against a dev-only package cannot reach a visitor, and forcing an
      # incompatible major to silence one is how build systems get broken.
      # See SECURITY.md.
      - name: Report development dependency advisories
        run: npm audit --audit-level=high || true

  e2e:
    name: End-to-end tests (${{ matrix.project }})
    runs-on: ubuntu-latest

    strategy:
      # One engine's failure must not hide another's.
      fail-fast: false
      matrix:
        # A job per engine rather than one job running all four. The suite takes
        # the same time either way, but these run at once, so adding Firefox and
        # WebKit costs wall-clock time only for the browser download. WebKit is
        # the one that matters most: it is where `localStorage` actually throws
        # on access, which is the path `core/storage.ts` exists for, and the
        # engine furthest from Chromium on Trusted Types and service workers.
        include:
          - project: chromium
            browser: chromium
          # A Pixel 7 viewport, driven by Chromium.
          - project: mobile
            browser: chromium
          - project: firefox
            browser: firefox
          - project: webkit
            browser: webkit

    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-node@v7
        with:
          node-version-file: .nvmrc
          cache: npm

      - run: npm ci

      # Only the engine this job runs, rather than all three every time.
      - name: Install Playwright browsers
        run: npx playwright install --with-deps ${{ matrix.browser }}

      # Runs against the production build via `vite preview`, which is the only
      # place the strict Content Security Policy, the service worker and the real
      # generator worker exist.
      - name: Run Playwright
        run: npx playwright test --project=${{ matrix.project }}

      - name: Upload the report on failure
        if: failure()
        uses: actions/upload-artifact@v7
        with:
          name: playwright-report-${{ matrix.project }}
          path: playwright-report
          retention-days: 7
