name: CI

on:
  push:
    branches: [main]
  pull_request:
  # Weekly, so a newly published advisory against a dependency is noticed even
  # when nobody has touched the repository.
  schedule:
    - cron: '17 5 * * 1'

# Cancel a superseded run rather than paying for both.
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  verify:
    name: Format, lint, typecheck, unit tests, build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-node@v5
        with:
          node-version-file: .nvmrc
          cache: npm

      # `npm ci` installs exactly what the lockfile pins and fails if
      # package.json and the lockfile disagree.
      - run: npm ci

      - name: Check formatting
        run: npm run format:check

      - name: Lint
        run: npm run lint

      - name: Typecheck
        run: npm run typecheck

      - name: Unit tests with coverage
        run: npm run test:coverage

      - name: Build
        run: npm run build

      - name: Upload the built site
        uses: actions/upload-artifact@v4
        with:
          name: dist
          path: dist
          retention-days: 7

  audit:
    name: Dependency audit
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v5
        with:
          node-version-file: .nvmrc
          cache: npm
      - run: npm ci

      # The site ships zero runtime dependencies, so this is the audit that
      # speaks to what users actually receive. It must stay clean.
      - name: Audit production dependencies
        run: npm audit --omit=dev --audit-level=low

      # Build-time tooling is reported but does not fail the build: an advisory
      # against a dev-only package cannot reach a visitor, and forcing an
      # incompatible major to silence one is how build systems get broken.
      # See SECURITY.md.
      - name: Report development dependency advisories
        run: npm audit --audit-level=high || true

  e2e:
    name: End-to-end tests
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-node@v5
        with:
          node-version-file: .nvmrc
          cache: npm

      - run: npm ci

      - name: Install Playwright browsers
        run: npx playwright install --with-deps chromium

      # Runs against the production build via `vite preview`, which is the only
      # place the strict Content Security Policy and the real worker exist.
      - name: Run Playwright
        run: npm run e2e

      - name: Upload the report on failure
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: playwright-report
          path: playwright-report
          retention-days: 7
