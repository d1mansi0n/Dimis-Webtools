version: 2

updates:
  # Build-time dependencies. There are no runtime ones to update.
  - package-ecosystem: npm
    directory: /
    schedule:
      interval: weekly
      day: monday
    open-pull-requests-limit: 5
    groups:
      # One pull request for the routine bumps, so review effort goes to the
      # updates that actually change something.
      dev-dependencies:
        patterns: ['*']
        update-types: ['minor', 'patch']
    commit-message:
      prefix: 'chore(deps)'

  # Workflow actions are executable code with access to the repository, so they
  # are worth tracking as closely as the packages.
  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: weekly
      day: monday
    commit-message:
      prefix: 'chore(actions)'
