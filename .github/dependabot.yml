version: 2

updates:
  # Build-time dependencies. There are no runtime ones to update.
  - package-ecosystem: npm
    directory: /
    schedule:
      interval: weekly
      day: monday
    open-pull-requests-limit: 5
    groups:
      # Families whose packages pin each other and must move together, majors
      # included. Bumped singly they fail at `npm ci` on a peer conflict, so the
      # pull request can never go green — the first run of this config produced
      # exactly that for vitest, @vitest/coverage-v8 and @eslint/js.
      #
      # These are listed before the catch-all because a dependency joins the
      # first group whose patterns match it.
      vitest:
        patterns: ['vitest', '@vitest/*']
      eslint:
        patterns: ['eslint', '@eslint/*', 'eslint-config-*', 'typescript-eslint']

      # One pull request for the routine bumps, so review effort goes to the
      # updates that actually change something.
      dev-dependencies:
        patterns: ['*']
        update-types: ['minor', 'patch']
    commit-message:
      prefix: 'chore(deps)'

  # Workflow actions are executable code with access to the repository, so they
  # are worth tracking as closely as the packages.
  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: weekly
      day: monday
    commit-message:
      prefix: 'chore(actions)'
