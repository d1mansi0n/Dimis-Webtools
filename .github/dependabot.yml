version: 2

# Tuned for signal over volume.
#
# The first configuration here was weekly with per-family groups, and its opening
# run produced ten pull requests in one morning — one per package, three of which
# could not pass because Dependabot had split packages that pin each other.
#
# This site ships no runtime dependencies at all: everything below is build-time
# tooling, so a routine version bump cannot reach anyone visiting the site. That
# makes a monthly digest the right cadence, and a single pull request per
# ecosystem the right shape. At most two arrive per month.
#
# Security updates are deliberately *not* covered by these groups. Dependabot
# raises those separately and immediately, which is what should happen — an
# advisory should not wait for the monthly digest or be buried in it.

updates:
  - package-ecosystem: npm
    directory: /
    schedule:
      interval: monthly
    # One grouped pull request, so it cannot exceed one either.
    open-pull-requests-limit: 1
    groups:
      npm:
        # Everything, majors included. Packages that pin each other — vitest and
        # its coverage provider, eslint and its config packages — must move
        # together or the install fails outright, and the only way to guarantee
        # that is to move all of them at once.
        patterns: ['*']
    commit-message:
      prefix: 'chore(deps)'

  # Workflow actions are executable code with access to the repository, so they
  # are worth tracking as closely as the packages.
  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: monthly
    open-pull-requests-limit: 1
    groups:
      actions:
        patterns: ['*']
    commit-message:
      prefix: 'chore(actions)'
