<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>Time Tracking · Dimis Webtools</title>
    <meta
      name="description"
      content="Track time with start, pause and stop, add comments by voice, and export everything to a spreadsheet."
    />
    <link rel="icon" href="/icon.svg" type="image/svg+xml" />
    <link rel="manifest" href="/manifest.webmanifest" />
    <script type="module" src="/src/tools/time/main.ts"></script>
  </head>
  <body>
    <a class="skip-link" href="#main"></a>
    <header class="appbar"></header>
    <main id="main" class="page">
      <!--
        Title on the left, the running total on the right. The total used to sit
        in a card of its own halfway down the page, below the list it totals,
        which is the one place it could not be read while the list was scrolled.
      -->
      <div class="page-header time-header">
        <h1 data-time="title"></h1>
        <p class="time-header__total">
          <span class="stat__label" data-time="totalLabel"></span>
          <span class="stat__value numeric" data-time="total">00:00:00</span>
        </p>
      </div>

      <div class="stack">
        <div class="toolbar">
          <div class="toolbar__group">
            <button class="btn btn--primary" type="button" data-time="new"></button>
          </div>
          <span class="toolbar__divider" aria-hidden="true"></span>
          <div class="toolbar__group">
            <button class="btn" type="button" data-time="format"></button>
            <button class="btn" type="button" data-time="export"></button>
          </div>
          <!--
            Dictation is a way of entering time rather than an action on it, so
            it sits apart from the buttons that do things to the list.
          -->
          <div class="toolbar__group toolbar__end time-voice">
            <button class="btn" type="button" data-time="voice"></button>
            <select data-time="voiceLang">
              <option value="en-US">English</option>
              <option value="de-DE">Deutsch</option>
            </select>
          </div>
        </div>
        <p class="msg" data-time="feedback" role="status" aria-live="polite"></p>
      </div>

      <section class="section panel">
        <div class="section__head">
          <h2 data-time="entriesTitle"></h2>
          <button class="btn btn--sm btn--danger" type="button" data-time="clear"></button>
        </div>
        <p class="empty" data-time="empty"></p>
        <div class="time-entries" data-time="entries"></div>
      </section>

      <section class="section panel">
        <div class="section__head">
          <h2 data-time="commentsTitle"></h2>
          <div class="toolbar__group">
            <button class="btn btn--sm" type="button" data-time="toggleComments"></button>
            <button
              class="btn btn--sm btn--danger"
              type="button"
              data-time="clearComments"
              hidden
            ></button>
          </div>
        </div>
        <div data-time="commentsList" hidden></div>
      </section>
    </main>

    <datalist id="comment-suggestions"></datalist>
  </body>
</html>
