<!DOCTYPE html>
<html lang="de">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Zuckerrechner 2.0</title>
<style>
  :root {
    --bg: #f4f5fb; --card: #ffffff; --text: #1f2333; --muted: #6b7186;
    --accent: #4f46e5; --accent-soft: #eef0ff; --border: #e3e5f0;
    --warn: #d97706; --shadow: 0 6px 18px rgba(31,35,51,.08);
  }
  @media (prefers-color-scheme: dark) {
    :root {
      --bg: #14151d; --card: #1e2029; --text: #eceef6; --muted: #9aa0b4;
      --accent: #818cf8; --accent-soft: #2a2c44; --border: #32354a;
      --warn: #fbbf24; --shadow: 0 6px 18px rgba(0,0,0,.4);
    }
  }
  * { box-sizing: border-box; }
  body {
    margin: 0; min-height: 100vh; padding: 1.25rem;
    font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, "Helvetica Neue", Arial, sans-serif;
    background: var(--bg); color: var(--text);
  }
  .appbar { max-width: 560px; margin: 0 auto .9rem; display: flex; align-items: center; gap: .6rem; font-size: .85rem; }
  .appbar a { color: var(--muted); text-decoration: none; }
  .appbar a:hover { color: var(--accent); }
  .vtag { margin-left: auto; font-weight: 700; color: var(--accent); background: var(--accent-soft); border-radius: 999px; padding: .2rem .6rem; font-size: .72rem; }
  main { max-width: 560px; margin: 0 auto; display: grid; gap: 1rem; }
  .card { background: var(--card); border: 1px solid var(--border); border-radius: 14px; padding: 1.25rem; box-shadow: var(--shadow); }
  h1 { margin: 0 0 .25rem; font-size: 1.45rem; letter-spacing: -.02em; }
  .lead { margin: 0 0 1rem; color: var(--muted); font-size: .9rem; }
  label { display: block; font-size: .85rem; font-weight: 600; margin-bottom: .35rem; }
  .input-row { display: flex; align-items: center; gap: .5rem; }
  input[type=number] {
    flex: 1; font: inherit; font-size: 1.15rem; padding: .65rem .8rem; color: var(--text);
    background: var(--bg); border: 1px solid var(--border); border-radius: 10px; outline: none;
  }
  input[type=number]:focus { border-color: var(--accent); }
  .unit { color: var(--muted); font-weight: 600; }
  .hint { color: var(--warn); font-size: .82rem; min-height: 1.1em; margin: .4rem 0 0; }
  .stats { display: grid; grid-template-columns: 1fr 1fr; gap: .75rem; }
  .stat { background: var(--accent-soft); border-radius: 12px; padding: .8rem .9rem; }
  .stat .num { font-size: 1.5rem; font-weight: 700; color: var(--accent); }
  .stat .lbl { font-size: .78rem; color: var(--muted); }
  .cubes { margin-top: .9rem; line-height: 1.7; font-size: 1.05rem; letter-spacing: .1em; word-break: break-all; }
  h2 { margin: 0 0 .3rem; font-size: 1.05rem; }
  .note { margin: 0 0 .75rem; color: var(--muted); font-size: .8rem; }
  ul.compare { list-style: none; margin: 0; padding: 0; }
  ul.compare li {
    display: flex; justify-content: space-between; gap: 1rem;
    padding: .45rem .55rem; border-radius: 8px; font-size: .92rem;
  }
  ul.compare li:nth-child(odd) { background: var(--bg); }
  ul.compare li.nearest { background: var(--accent-soft); font-weight: 700; color: var(--accent); }
  ul.compare .g { white-space: nowrap; color: var(--muted); }
  ul.compare li.nearest .g { color: inherit; }
  .empty { color: var(--muted); font-size: .9rem; }
</style>
</head>
<body>
<nav class="appbar">
  <a href="index.html">&larr; Dimis Webtools</a>
  <span class="vtag">2.0</span>
  <a href="ZR-index.html" onclick="localStorage.setItem('dwt-version','1')">Zur Version 1.0</a>
</nav>
<main>
  <section class="card">
    <h1>Zuckerrechner</h1>
    <p class="lead">Gib eine Zuckermenge ein und sieh sofort, was sie bedeutet.</p>
    <label for="zuckerInput">Zuckermenge in Gramm</label>
    <div class="input-row">
      <input id="zuckerInput" type="number" inputmode="decimal" min="0" step="any" placeholder="z.&thinsp;B. 15" autofocus>
      <span class="unit">g</span>
    </div>
    <p class="hint" id="hint"></p>
  </section>

  <section class="card" id="resultCard" hidden>
    <div class="stats">
      <div class="stat"><div class="num" id="wuerfel">–</div><div class="lbl">Zuckerwürfel (à 3&thinsp;g)</div></div>
      <div class="stat"><div class="num" id="whoPct">–</div><div class="lbl">der WHO-Tagesempfehlung (max. 50&thinsp;g)</div></div>
    </div>
    <div class="cubes" id="cubeVisual" aria-hidden="true"></div>
  </section>

  <section class="card" id="compareCard" hidden>
    <h2>Ähnliche Lebensmittel</h2>
    <p class="note">Zuckergehalt pro 100&thinsp;g – das am nächsten liegende Lebensmittel ist hervorgehoben.</p>
    <ul class="compare" id="vergleichsListe"></ul>
  </section>
</main>
<script>
"use strict";
const zuckerListe = [
  { name: "Wasser", sugar: 0.0 },
  { name: "Schwarzer Kaffee (ohne Zucker)", sugar: 0.0 },
  { name: "Bier (Pils)", sugar: 0.0 },
  { name: "Spinat (frisch)", sugar: 0.5 },
  { name: "Avocado", sugar: 0.7 },
  { name: "Gurke", sugar: 1.5 },
  { name: "Zucchini", sugar: 1.7 },
  { name: "Paprika (grün)", sugar: 2.4 },
  { name: "Zitrone", sugar: 2.5 },
  { name: "Tomate", sugar: 2.6 },
  { name: "Brombeere", sugar: 2.7 },
  { name: "Pizza Margherita (Tiefkühl)", sugar: 3.1 },
  { name: "Toastbrot (Weißbrot)", sugar: 3.5 },
  { name: "Zwiebel", sugar: 4.3 },
  { name: "Karotte (Möhre)", sugar: 4.7 },
  { name: "Himbeere", sugar: 4.8 },
  { name: "Vollmilch (3.5% Fett)", sugar: 4.9 },
  { name: "Erdbeere", sugar: 4.9 },
  { name: "Johannisbeere (rot)", sugar: 7.3 },
  { name: "Heidelbeere (Blaubeere)", sugar: 7.4 },
  { name: "Aprikose", sugar: 8.5 },
  { name: "Pfirsich", sugar: 8.9 },
  { name: "Grapefruit", sugar: 8.9 },
  { name: "Orange", sugar: 9.2 },
  { name: "Mandarine", sugar: 10.1 },
  { name: "Pflaume", sugar: 10.2 },
  { name: "Cola (normal)", sugar: 10.6 },
  { name: "Sauerkirsche", sugar: 11.0 },
  { name: "Energy-Drink (Red Bull)", sugar: 11.0 },
  { name: "Apfel", sugar: 11.4 },
  { name: "Apfelsaft (100% Fruchtsaft)", sugar: 11.7 },
  { name: "Banane", sugar: 12.2 },
  { name: "Birne", sugar: 12.4 },
  { name: "Nektarine", sugar: 12.4 },
  { name: "Mango", sugar: 12.8 },
  { name: "Ananas", sugar: 13.1 },
  { name: "Süßkirsche", sugar: 13.3 },
  { name: "Maracuja (Passionsfrucht)", sugar: 13.4 },
  { name: "Mirabelle", sugar: 14.0 },
  { name: "Weintraube", sugar: 15.6 },
  { name: "Granatapfel", sugar: 16.7 },
  { name: "Ketchup", sugar: 22.8 },
  { name: "Zartbitterschokolade (70%)", sugar: 29.7 },
  { name: "Gummibärchen", sugar: 46.0 },
  { name: "Milchschokolade", sugar: 47.0 },
  { name: "Nuss-Nougat-Creme", sugar: 56.3 },
  { name: "Rosinen", sugar: 59.2 },
  { name: "Marmelade (Konfitüre)", sugar: 62.0 },
  { name: "Honig", sugar: 80.0 },
  { name: "Haushaltszucker (Saccharose)", sugar: 99.8 }
].sort((a, b) => a.sugar - b.sugar);

const WHO_MAX_G = 50;      // WHO: max. 50 g freier Zucker pro Tag
const CUBE_G = 3;          // 1 Zuckerwürfel = 3 g
const MAX_CUBE_ICONS = 60;

const input = document.getElementById("zuckerInput");
const hint = document.getElementById("hint");
const resultCard = document.getElementById("resultCard");
const compareCard = document.getElementById("compareCard");
const wuerfelEl = document.getElementById("wuerfel");
const whoPctEl = document.getElementById("whoPct");
const cubeVisual = document.getElementById("cubeVisual");
const listEl = document.getElementById("vergleichsListe");

const fmt = n => n.toLocaleString("de-DE", { maximumFractionDigits: 1 });

function berechne() {
  const raw = input.value.trim();
  const grams = parseFloat(raw.replace(",", "."));
  hint.textContent = "";

  if (raw === "" || isNaN(grams) || grams < 0) {
    resultCard.hidden = true;
    compareCard.hidden = true;
    if (raw !== "") hint.textContent = "Bitte eine gültige Menge (≥ 0) eingeben.";
    return;
  }

  const cubes = grams / CUBE_G;
  wuerfelEl.textContent = fmt(cubes);
  whoPctEl.textContent = fmt((grams / WHO_MAX_G) * 100) + " %";

  const whole = Math.round(cubes);
  cubeVisual.textContent = whole > MAX_CUBE_ICONS
    ? "🧊".repeat(MAX_CUBE_ICONS) + ` … (${whole} insgesamt)`
    : "🧊".repeat(whole);
  resultCard.hidden = false;

  // Nearest item by absolute distance (works for any input, also above 99.8 g)
  let nearest = 0;
  zuckerListe.forEach((p, i) => {
    if (Math.abs(p.sugar - grams) < Math.abs(zuckerListe[nearest].sugar - grams)) nearest = i;
  });
  const start = Math.min(Math.max(0, nearest - 5), Math.max(0, zuckerListe.length - 11));
  const window_ = zuckerListe.slice(start, start + 11);
  listEl.innerHTML = window_.map((p, i) =>
    `<li class="${start + i === nearest ? "nearest" : ""}"><span>${p.name}</span><span class="g">${fmt(p.sugar)}&thinsp;g</span></li>`
  ).join("");
  compareCard.hidden = false;
}

input.addEventListener("input", berechne);
</script>
</body>
</html>
