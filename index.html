<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>Dimis Webtools</title>
    <meta
      name="description"
      content="A small collection of offline browser tools: Sudoku, a rice-to-water converter, time tracking, a sugar calculator, a picture counter and a scaling recipe shopping list. Nothing leaves your device."
    />
    <link rel="icon" href="/icon.svg" type="image/svg+xml" />
    <link rel="manifest" href="/manifest.webmanifest" />
    <script type="module" src="/src/tools/hub/main.ts"></script>
  </head>
  <body>
    <a class="skip-link" href="#main"></a>
    <header class="appbar"></header>
    <main id="main" class="page">
      <div class="page-header page-header--hero">
        <h1 data-hub="title"></h1>
        <p class="lead" data-hub="tagline"></p>
      </div>
      <ul class="tool-list" data-hub="tools"></ul>
    </main>
    <footer class="site-footer" data-hub="footer"></footer>
  </body>
</html>
