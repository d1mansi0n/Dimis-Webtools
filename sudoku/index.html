<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>Sudoku · Dimis Webtools</title>
    <meta
      name="description"
      content="Play Sudoku with a timer, pencil notes, saved games and best times. Puzzles are generated on your own device."
    />
    <link rel="icon" href="/icon.svg" type="image/svg+xml" />
    <link rel="manifest" href="/manifest.webmanifest" />
    <script type="module" src="/src/tools/sudoku/main.ts"></script>
  </head>
  <body>
    <a class="skip-link" href="#main"></a>
    <header class="appbar"></header>
    <main id="main" class="page">
      <!--
        Title, difficulty and clock in one bar. The clock used to be the largest
        accent-coloured thing on the page from the moment it read 00:01, which
        spent the site's one colour on a number nobody is looking at.
      -->
      <div class="page-header sudoku-header">
        <h1 data-sudoku="title"></h1>
        <div class="sudoku-status">
          <span class="cluster">
            <label for="sudoku-difficulty" data-sudoku="difficultyLabel"></label>
            <select id="sudoku-difficulty"></select>
          </span>
          <span class="cluster sudoku-timer">
            <span class="sudoku-timer__value numeric" data-sudoku="timer">00:00</span>
            <button class="btn btn--icon" type="button" data-sudoku="pause"></button>
          </span>
        </div>
      </div>

      <div class="sudoku-grid-wrapper" data-sudoku="wrapper">
        <div class="sudoku-grid" data-sudoku="grid" role="grid"></div>
        <p class="sudoku-paused" data-sudoku="pausedOverlay"></p>
      </div>

      <!--
        Two rows, because these ten buttons are not ten peers. The first row is
        what a player reaches for with a puzzle in front of them; the second
        manages the game itself. They used to be one wrapping pile in markup
        order, so "Reset" arrived at the same weight as "Check".
      -->
      <div class="stack sudoku-actions">
        <div class="toolbar">
          <div class="toolbar__group">
            <button class="btn" type="button" data-sudoku="undo"></button>
            <button class="btn" type="button" data-sudoku="check"></button>
            <button class="btn" type="button" data-sudoku="hint"></button>
            <button class="btn" type="button" data-sudoku="notes"></button>
          </div>
          <div class="toolbar__group toolbar__end">
            <button
              class="btn btn--icon"
              type="button"
              data-sudoku="validation"
              aria-pressed="true"
            ></button>
          </div>
        </div>

        <div class="toolbar">
          <div class="toolbar__group">
            <button class="btn btn--primary" type="button" data-sudoku="new"></button>
          </div>
          <span class="toolbar__divider" aria-hidden="true"></span>
          <div class="toolbar__group">
            <button class="btn" type="button" data-sudoku="save"></button>
            <button class="btn" type="button" data-sudoku="load"></button>
            <button class="btn" type="button" data-sudoku="best"></button>
            <button class="btn btn--danger" type="button" data-sudoku="reset"></button>
          </div>
        </div>
      </div>

      <p class="msg" data-sudoku="message" role="status" aria-live="polite"></p>

      <div class="stack sudoku-hints">
        <p class="note" data-sudoku="radialHint"></p>
        <p class="note sudoku-kb-hint" data-sudoku="kbHint"></p>
      </div>
    </main>

    <!--
      The radial number picker. Positioned at the point that was tapped, so the
      digits come to the finger rather than the finger travelling to a keypad at
      the bottom of the screen. Lives outside `main` because it is fixed to the
      viewport, and the overlay behind it catches taps that should dismiss it.
    -->
    <div class="sudoku-radial-overlay" data-sudoku="radialOverlay" hidden></div>
    <div
      class="sudoku-radial"
      data-sudoku="radial"
      role="menu"
      aria-label="Number picker"
      hidden
    ></div>
  </body>
</html>
